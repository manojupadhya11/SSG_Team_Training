apiVersion: v1
kind: Pod
metadata:
  name: emptydir-example
spec:
  containers:
  - name: app-container
    image: busybox
    command: ["sh", "-c", "echo 'Hello from container 1' > /data/hello.txt; sleep 3600"]
    volumeMounts:
    - mountPath: /data
      name: shared-data
  - name: app-container-2
    image: busybox
    command: ["sh", "-c", "cat /data/hello.txt; sleep 3600"]
    volumeMounts:
    - mountPath: /data
      name: shared-data
  volumes:
  - name: shared-data
    emptyDir: {}

