apiVersion: v1
kind: Pod
metadata:
  name: hostpath-example
spec:
  containers:
  - name: app-container
    image: busybox
    command: ["sh", "-c", "echo 'Hello from host' > /mnt/data/hostfile.txt; sleep 3600"]
    volumeMounts:
    - mountPath: /mnt/data
      name: host-data
  volumes:
  - name: host-data
    hostPath:
      path: /tmp
      type: Directory

