apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx  # Matches the label in the Deployment
  ports:
    - protocol: TCP
      port: 80           # Port inside the cluster (Service port)
      targetPort: 80     # Port exposed by the container
      nodePort: 30080    # Optional: Pick a port from 30000–32767
