apiVersion: v1
kind: Pod
metadata:
  name: app-pod
spec:
  containers:
  - name: app-container
    image: busybox
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "Mode: $APP_MODE"
        echo "Port: $APP_PORT"
        sleep 3600
    envFrom:
    - configMapRef:
        name: app-config
